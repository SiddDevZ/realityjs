<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reality.js: Lake Tahoe</title>
  <meta name="description" content="A real-time Lake Tahoe shoreline in three.js: shallow-water surf simulation, FFT waves, photon-traced caustics." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #load { position: fixed; inset: 0; display: grid; place-items: center; color: #9fb3c8; font: 13px/1.4 ui-monospace, monospace; letter-spacing: .08em; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="load">warming up the sea</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
